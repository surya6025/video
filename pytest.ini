[tool:pytest]
# Pytest configuration for JarvisX

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    --durations=10
    --color=yes

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    gui: marks tests that require GUI
    network: marks tests that require network access
    database: marks tests that require database access

# Test collection
collect_ignore = 
    tests/__pycache__
    tests/.pytest_cache
    **/__pycache__
    **/.pytest_cache

# Minimum version requirements
minversion = 6.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Test session configuration
test_session_start = 
    import sys
    import os
    # Add project root to path
    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))

# Coverage configuration (when using pytest-cov)
addopts = 
    --cov=core
    --cov=ui
    --cov=skills
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Environment variables for tests
env =
    PYTHONPATH = {toxinidir}
    JARVISX_TEST_MODE = true
    JARVISX_TEMP_DIR = {toxinidir}/temp/test